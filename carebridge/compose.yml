services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: carebridge
      MYSQL_USER: carebridge
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u carebridge -p\"$$MYSQL_PASSWORD\" -D carebridge -N -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 25s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/carebridge?sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USER: carebridge
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DOCTOR_SIGNUP_CODE: ${DOCTOR_SIGNUP_CODE:-}
      SECURE_COOKIE: "false"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      AI_DEMO_CODE: ${AI_DEMO_CODE:-}

volumes:
  mysql_data:
