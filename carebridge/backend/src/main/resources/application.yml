spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/carebridge}
    username: ${DB_USER:carebridge}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
server:
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SECURE_COOKIE:false}
carebridge:
  doctor-code: ${DOCTOR_SIGNUP_CODE:}
  ai:
    key: ${LLM_API_KEY:}
    url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${LLM_MODEL:gpt-4o-mini}
